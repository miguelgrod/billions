# Despliegue de Billions a su propio bucket.
#
# El proyecto vivía dentro del repo de Bonitu y se publicaba con él; desde
# agosto de 2026 tiene repositorio, bucket y distribución propios. Aquí todo
# cuelga de la raíz, así que el sync sale de `.` y hay que excluir a mano lo
# que no es del sitio.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  BUCKET: billions-cine
  REGION: eu-west-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.REGION }}

      # Todo menos index.html se guarda un año. Se puede porque cada <script src>
      # lleva la huella de su contenido (tools/sella-versiones.py): si un archivo
      # cambia, cambia su URL, y nunca hay que invalidar una copia guardada.
      #
      # Fuera del bucket: los Excel de origen, los scripts de tools/, la
      # documentación y lo que es del repositorio y no del sitio.
      - name: Sincronizar con S3
        run: |
          aws s3 sync . "s3://${BUCKET}" --delete \
            --exclude "*.html" \
            --exclude "*.md" \
            --exclude "*.xlsx" \
            --exclude ".git/*" \
            --exclude ".gitignore" \
            --exclude ".github/*" \
            --exclude "tools/*" \
            --exclude "build/*" \
            --exclude ".DS_Store" \
            --exclude "*/.DS_Store" \
            --cache-control "public, max-age=31536000, immutable"

      # Las páginas HTML van sin caché. index.html porque es la puerta de entrada
      # y la que trae las huellas nuevas —si se guardase, el navegador seguiría
      # pidiendo las versiones viejas de todo lo demás—, y las legales porque
      # tienen que poder corregirse el mismo día.
      - name: Subir las páginas HTML sin caché
        run: |
          aws s3 cp . "s3://${BUCKET}" --recursive \
            --exclude "*" --include "*.html" \
            --cache-control "no-cache, must-revalidate" \
            --content-type "text/html; charset=utf-8"

      # CloudFront no sabe solo qué enseñar cuando algo falla: sin esto, una URL
      # inventada devuelve el XML de S3. Y devuelve 403 y no 404, porque con OAC
      # el bucket no da permiso de listado y un objeto que no existe se responde
      # como acceso denegado: por eso se mapean los dos códigos a /404.html.
      #
      # El paso es idempotente: si la distribución ya tiene respuestas de error
      # configuradas, no la toca. Sólo escribe la primera vez.
      - name: Configurar páginas de error en CloudFront
        if: ${{ vars.BILLIONS_CF_ID != '' }}
        run: |
          set -euo pipefail
          aws cloudfront get-distribution-config \
            --id "${{ vars.BILLIONS_CF_ID }}" > /tmp/dist.json
          if [ "$(jq -r '.DistributionConfig.CustomErrorResponses.Quantity' /tmp/dist.json)" != "0" ]; then
            echo "Ya tiene respuestas de error configuradas; no se toca."
            exit 0
          fi
          ETAG=$(jq -r '.ETag' /tmp/dist.json)
          jq '.DistributionConfig.CustomErrorResponses = {
                "Quantity": 3,
                "Items": [
                  { "ErrorCode": 403, "ResponsePagePath": "/404.html",
                    "ResponseCode": "404", "ErrorCachingMinTTL": 10 },
                  { "ErrorCode": 404, "ResponsePagePath": "/404.html",
                    "ResponseCode": "404", "ErrorCachingMinTTL": 10 },
                  { "ErrorCode": 500, "ResponsePagePath": "/500.html",
                    "ResponseCode": "500", "ErrorCachingMinTTL": 0 }
                ]
              } | .DistributionConfig' /tmp/dist.json > /tmp/config.json
          aws cloudfront update-distribution \
            --id "${{ vars.BILLIONS_CF_ID }}" \
            --if-match "$ETAG" \
            --distribution-config file:///tmp/config.json > /dev/null
          echo "Páginas de error configuradas."

      - name: Invalidar caché de CloudFront
        if: ${{ vars.BILLIONS_CF_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.BILLIONS_CF_ID }}" --paths "/*"

      - name: Resumen
        run: |
          echo "### Billions desplegado" >> $GITHUB_STEP_SUMMARY
          echo "- Bucket \`${BUCKET}\` (${REGION})" >> $GITHUB_STEP_SUMMARY
          echo "- https://ganoyo.com" >> $GITHUB_STEP_SUMMARY
