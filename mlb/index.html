<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfect Nine · MLB trivia</title>
  <meta name="description" content="Twenty bubbles, twenty questions about baseball. Pick a bubble, answer before the clock runs out, and clear the field before three outs.">
  <script src="vendor/tailwind.js?v=2810894e"></script>
  <style>
    @font-face {
      font-family: 'Inter'; font-style: normal; font-weight: 100 900; font-display: swap;
      src: url('fonts/inter-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'Inter'; font-style: normal; font-weight: 100 900; font-display: swap;
      src: url('fonts/inter-latin-ext.woff2') format('woff2');
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+2113, U+A720-A7FF;
    }
    :root { color-scheme: dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
      background: #06120d; color: rgba(255,255,255,0.92);
    }
    .display { letter-spacing: -0.045em; font-weight: 800; }

    /* ---- el fondo ---------------------------------------------------
       La foto del estadio va difuminada y muy apagada: es una textura que
       sitúa el juego, no una imagen que mirar. Encima de ella tiene que
       leerse texto blanco pequeño, y eso manda.

       El desenfoque va en dos partes: la imagen se sirve a 480 px y el
       navegador la estira a pantalla completa —eso ya suaviza— y encima un
       `blur` corto. Pre-difuminarla del todo habría hecho falta una
       herramienta de imagen que este proyecto no tiene, y de paso pesa 56 KB
       en vez de 4,4 MB.

       El `scale` no es decorativo: sin él, el desenfoque arrastra el borde de
       la imagen hacia dentro y se ve una franja clara en los cuatro lados. */
    .fondo-foto {
      position: fixed; inset: 0; z-index: -20;
      background: #06120d url('imgs/stadium.jpg') center/cover no-repeat;
      filter: blur(6px) saturate(.85) brightness(.92);
      transform: scale(1.08);
    }
    /* Va en un div fijo y no con `background-attachment: fixed`, que en iOS da
       problemas. */
    .fondo-velo {
      position: fixed; inset: 0; z-index: -10; pointer-events: none;
      background:
        radial-gradient(70% 55% at 15% 0%, rgba(46,161,102,.14), transparent 60%),
        radial-gradient(60% 50% at 88% 8%, rgba(200,16,46,.10), transparent 60%),
        linear-gradient(180deg, rgba(4,14,10,.62) 0%, rgba(4,14,10,.70) 55%, rgba(4,14,10,.80) 100%);
    }
    .seam { background-image: repeating-linear-gradient(-45deg, #C8102E 0 3px, transparent 3px 9px); }
    .glass {
      background: rgba(12,26,20,0.60); border: 1px solid rgba(255,255,255,0.10);
      backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%);
    }

    /* ---- el campo de burbujas ---------------------------------------
       Replicado del campo de Billions, que es donde se afinó esto.

       El centrado va en `transform` y la deriva en la propiedad `translate`,
       que es independiente: así una no pisa a la otra. La escala del resalte
       vive en la esfera interior, por el mismo motivo. */
    .burbuja {
      position: absolute;
      transform: translate(-50%, -50%);
      /* Avisos al navegador para que componga en la GPU: es lo que evita los
         tirones al animar veinte burbujas a la vez en un móvil. */
      will-change: transform;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
    }

    /* La deriva se separa en dos ejes con periodos distintos. Cada eje va y
       viene con una curva casi sinusoidal, así que sólo se detiene en los
       extremos, como un péndulo: no hay tirones. Un único fotograma con varios
       puntos y ease-in-out frenaba en cada punto intermedio.

       El `animation-delay` negativo es lo que de verdad se nota: sin él, las
       veinte burbujas empiezan a la vez y el campo entero respira al unísono,
       que es lo que delataba que esto era una animación y no un flotar. */
    @keyframes derivaX { to { translate: var(--dx) 0; } }
    @keyframes derivaY { to { translate: 0 var(--dy); } }
    .deriva-x {
      will-change: translate;
      animation: derivaX var(--tx) cubic-bezier(.45,0,.55,1) infinite alternate;
      animation-delay: var(--rx);
    }
    .deriva-y {
      will-change: translate;
      animation: derivaY var(--ty) cubic-bezier(.45,0,.55,1) infinite alternate;
      animation-delay: var(--ry);
    }
    /* En móvil el campo es más pequeño y el mismo recorrido se percibe más
       lento: se acorta la duración un 22 %. */
    @media (max-width: 639px) {
      .deriva-x { animation-duration: calc(var(--tx) * .78); }
      .deriva-y { animation-duration: calc(var(--ty) * .78); }
    }

    .esfera {
      border-radius: 50%; border: 0; cursor: pointer; overflow: hidden;
      background-size: cover; background-position: center 28%;
      transition: transform .75s cubic-bezier(.2,.8,.2,1), filter .75s, opacity .6s, box-shadow .75s;
      transform-origin: center center;
      will-change: transform, opacity, filter;
    }
    .esfera .velo { position: absolute; inset: 0; border-radius: 50%; }
    .esfera .etiqueta {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 0 8%; font-weight: 800; letter-spacing: -0.01em;
      text-transform: uppercase; line-height: 1; color: #fff; opacity: 0;
      transition: opacity .28s; text-shadow: 0 1px 8px rgba(0,0,0,.65), 0 0 2px rgba(0,0,0,.5);
    }
    /* El foco de tvOS: la pieza crece y se aclara. */
    @media (hover: hover) {
      .esfera-tocable:hover { transform: scale(1.06) !important; filter: blur(0) !important; }
      .esfera-tocable:hover .etiqueta { opacity: 1; }
    }
    .esfera:focus-visible { outline: none; box-shadow: 0 0 0 4px rgba(255,255,255,.85) !important; }
    .esfera-elegida .etiqueta { opacity: 1; }

    /* La elegida late: un halo del color de su categoría que se expande y se
       apaga, dos veces, mientras se lee su rótulo. */
    @keyframes latido {
      0%, 100% { box-shadow: var(--sombra), 0 0 0 0 var(--halo); }
      55%      { box-shadow: var(--sombra), 0 0 0 22px transparent; }
    }
    .esfera-elegida { animation: latido 1.1s ease-out 2; }

    /* La jugada se va del campo: crece, se difumina y desaparece, como una
       pompa al reventar. La animación gana a la escala en línea del botón
       porque las animaciones pesan más que el atributo style. */
    @keyframes revienta {
      0%   { transform: scale(1);    opacity: 1;  filter: blur(0); }
      40%  { transform: scale(1.22); opacity: .9; filter: blur(0); }
      100% { transform: scale(1.55); opacity: 0;  filter: blur(7px); }
    }
    .revienta { animation: revienta .62s cubic-bezier(.2,.7,.3,1) forwards; pointer-events: none; }

    /* El rótulo de la categoría, al elegir. */
    @keyframes rotuloIn {
      0%   { opacity: 0; transform: scale(.82); filter: blur(6px); }
      55%  { opacity: 1; transform: scale(1.03); filter: blur(0); }
      100% { opacity: 1; transform: scale(1); }
    }
    .rotulo-in { animation: rotuloIn .6s cubic-bezier(.2,.8,.2,1) both; }

    /* ---- la pregunta ------------------------------------------------ */
    @keyframes entra { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
    .entra { animation: entra .5s cubic-bezier(.2,.8,.2,1) both; }
    /* El foco de tvOS también en las cartas: crece, se aclara y proyecta
       sombra, con la curva del sistema. */
    .carta { transition: transform .38s cubic-bezier(.2,.8,.2,1), box-shadow .38s, background .38s, border-color .38s; }
    @media (hover: hover) {
      .carta:not(:disabled):hover {
        transform: scale(1.055);
        box-shadow: 0 26px 60px rgba(0,0,0,.65);
        background: rgba(255,255,255,.10);
      }
    }
    .carta:focus-visible { outline: none; box-shadow: 0 0 0 4px rgba(255,255,255,.85), 0 26px 60px rgba(0,0,0,.65); }
    @keyframes cardIn { from { opacity: 0; transform: translateY(22px) scale(.96); } }
    .card-in { animation: cardIn .5s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes askIn { from { opacity: 0; transform: translateY(-8px); } }
    .ask-in { animation: askIn .45s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes bump { 40% { transform: scale(1.22); } }
    .score-bump { animation: bump .5s cubic-bezier(.2,.8,.2,1); }
    @keyframes lifeOut { 35% { transform: scale(1.55); } }
    .life-out { animation: lifeOut .5s ease-out; }
    @keyframes toastPop {
      0% { opacity: 0; transform: translateY(12px) } 8% { opacity: 1; transform: none }
      88% { opacity: 1; transform: none } 100% { opacity: 0; transform: translateY(-8px) }
    }
    #toast { animation: toastPop var(--dur, 3s) ease-out forwards; }
    @media (prefers-reduced-motion: reduce) {
      .deriva-x, .deriva-y, .esfera-elegida, .entra, .card-in, .ask-in,
      .rotulo-in, .score-bump, .life-out, #toast { animation: none }
      /* Sin animación no habría nada que la hiciera desaparecer y se quedaría
         a la vista hasta el repintado. */
      .revienta { animation: none; opacity: 0 }
      .esfera, .carta { transition: none }
    }
  </style>
</head>
<body class="min-h-screen antialiased">
  <div class="fondo-foto"></div>
  <div class="fondo-velo"></div>

  <div id="app" class="mx-auto flex min-h-screen max-w-3xl flex-col px-4 py-4 sm:px-6 sm:py-6">
    <header class="flex items-center justify-between gap-3">
      <div class="flex items-center gap-2.5">
        <span class="seam h-5 w-5 shrink-0 rounded-full opacity-80"></span>
        <div>
          <p class="display text-lg leading-none text-white sm:text-xl">Perfect Nine</p>
          <p id="left" class="mt-1 text-[11px] text-white/55">20 bubbles left</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <div id="vidas" class="flex gap-1.5"></div>
        <p class="tabular-nums text-lg font-bold text-white sm:text-xl"><span id="score">0</span></p>
        <button id="reset" type="button" title="New game"
                class="glass rounded-full p-2 text-white/70 hover:text-white">
          <svg viewBox="0 0 24 24" class="h-4 w-4 fill-current"><path d="M12 5V2L8 6l4 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7Z"/></svg>
        </button>
      </div>
    </header>

    <!-- El campo. Ocupa todo el ancho en móvil: el padding de #app le robaba 32 px. -->
    <section id="campo" class="relative -mx-4 mt-3 min-h-[62vh] flex-1 sm:mx-0"></section>

    <!-- La pregunta, que sustituye al campo mientras está abierta. Lleva su
         propia viñeta: el enunciado y la pista caen sobre la parte más clara de
         la foto —el césped iluminado— y ahí el texto pequeño se quedaba en
         6,6:1. Oscurecer el fondo entero para arreglar un bloque habría
         apagado el estadio en toda la pantalla. -->
    <section id="pregunta" class="hidden flex-1 flex-col justify-center"
             style="background:radial-gradient(58% 46% at 50% 46%, rgba(4,14,10,.86) 0%, rgba(4,14,10,.62) 55%, transparent 78%)">
      <div class="mx-auto w-full max-w-2xl">
        <p id="categoria" class="text-center text-[11px] font-bold uppercase tracking-[0.18em]"></p>
        <p id="enunciado" class="mt-3 text-center text-lg font-semibold leading-snug text-white sm:text-2xl"></p>
        <p id="pista" class="mt-2 text-center text-xs text-white/60"></p>
        <div class="mt-3 h-1.5 w-full overflow-hidden rounded-full bg-white/10">
          <div id="barra" class="h-full w-full rounded-full bg-[#FFB000] transition-none"></div>
        </div>
        <div id="cartas" class="mt-5 grid gap-2.5 sm:gap-3"></div>
      </div>
    </section>

    <p id="creditos" class="hidden pt-6 text-center text-[10px] leading-relaxed text-white/45">
      Data and player photos from the MLB Stats API · Not affiliated with MLB or its clubs
    </p>
  </div>

  <!-- Aviso de acierto o fallo. -->
  <div id="toast" class="pointer-events-none fixed inset-x-0 bottom-6 z-40 mx-auto hidden w-[min(92%,26rem)] rounded-3xl px-5 py-4 text-center">
    <p id="toast-msg" class="text-base font-bold"></p>
    <p id="toast-pts" class="mt-0.5 text-2xl font-extrabold tabular-nums"></p>
    <p id="toast-det" class="mt-1 text-xs opacity-80"></p>
  </div>

  <!-- Portada. -->
  <!-- La portada se pone ella misma el fondo en vez de dejar pasar el del
       documento: si dejara pasarlo, se verían por debajo la cabecera del juego
       y sus veinte burbujas, y serían dos campos superpuestos. -->
  <div id="intro" class="fixed inset-0 z-50 flex flex-col items-center justify-center px-6 text-center">
    <div class="fondo-foto"></div>
    <div class="fondo-velo"></div>
    <div id="intro-burbujas" class="pointer-events-none fixed inset-0"></div>
    <!-- Velo entre las pompas y el texto: sin él, una burbuja grande cae sobre
         el título y no hay manera de leerlo. -->
    <div class="pointer-events-none fixed inset-0" style="background:
      radial-gradient(48% 38% at 50% 45%, rgba(6,18,13,.92), rgba(6,18,13,.55) 70%, transparent 100%)"></div>
    <div class="relative">
      <p class="display text-white" style="font-size:clamp(2.6rem,11vw,5rem)">Perfect Nine</p>
      <p class="mt-3 text-base text-white/75 sm:text-lg">Twenty bubbles. Twenty questions.<br>Three outs and you're done.</p>
      <div id="intro-temas" class="mx-auto mt-7 flex max-w-lg flex-wrap justify-center gap-2"></div>
      <button id="jugar" type="button"
              class="mt-8 rounded-full bg-white px-9 py-3.5 text-base font-bold text-black">Play</button>
      <p class="mt-6 text-[11px] text-white/45">
        <a href="privacy.html" class="underline underline-offset-2 hover:text-white/50">Privacy</a>
      </p>
    </div>
  </div>

  <!-- Fin de partida. -->
  <div id="fin" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/75 p-4 backdrop-blur-sm">
    <div class="glass w-full max-w-sm rounded-3xl p-6 text-center">
      <p id="fin-titulo" class="display text-3xl text-white"></p>
      <p id="fin-detalle" class="mt-2 text-sm text-white/60"></p>
      <p id="fin-record" class="mt-1 text-xs text-white/55"></p>
      <button id="otra" type="button" class="mt-6 w-full rounded-2xl bg-white py-3 text-sm font-bold text-black">Play again</button>
    </div>
  </div>

  <script src="data/mlb-data.js?v=2af028cd"></script>
  <script src="motor.js?v=8d232ff9"></script>
  <script src="main.js?v=cd5cd173"></script>
</body>
</html>
