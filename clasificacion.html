<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billions · Clasificación</title>
  <script src="vendor/tailwind.js"></script>
  <style>
    :root { color-scheme: dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
      background: #07080c;
      color: rgba(255,255,255,0.9);
    }
    .display {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
      letter-spacing: -0.06em;
      font-weight: 700;
    }
    .glass-fuerte {
      background: rgba(15,16,22,0.52);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(22px) saturate(140%);
      -webkit-backdrop-filter: blur(22px) saturate(140%);
    }
    .foco { transition: transform .2s cubic-bezier(.2,.8,.2,1); }
    .foco:hover { transform: scale(1.03); }
    .foco:active { transform: scale(1); }
    /* La fila de quien acaba de registrar su marca, para encontrarse de un vistazo */
    .mia { background: rgba(48,209,88,.10); box-shadow: inset 2px 0 0 #30D158; }
    @media (prefers-reduced-motion: reduce) { .foco { transition: none; } }
  </style>
</head>
<body class="min-h-screen antialiased">
  <div class="pointer-events-none fixed inset-0 -z-20" style="background:#000"></div>
  <div class="pointer-events-none fixed inset-0 -z-20"
       style="background-image:url('imgs/bg_game.webp');background-size:cover;background-position:center;opacity:.18"></div>
  <div class="pointer-events-none fixed inset-0 -z-10"
       style="background:
         radial-gradient(65% 50% at 18% 12%, rgba(255,159,10,.12), transparent 60%),
         radial-gradient(55% 45% at 82% 22%, rgba(10,132,255,.12), transparent 60%),
         radial-gradient(65% 60% at 50% 92%, rgba(191,90,242,.10), transparent 60%)"></div>

  <main class="mx-auto flex min-h-screen max-w-3xl flex-col items-center px-4 py-10 sm:px-6">
    <header class="text-center">
      <p class="display leading-none text-white" style="font-size:clamp(2.2rem,7vw,3.5rem)">Clasificación</p>
      <p class="mt-2 text-sm text-white/50">Las mejores partidas de Billions</p>
    </header>

    <div class="glass-fuerte mt-8 w-full overflow-hidden rounded-[28px] shadow-2xl">
      <!-- La tabla se desplaza dentro de su caja: en un móvil estrecho, los
           nombres largos no deben empujar la página entera a lo ancho. -->
      <div id="caja" class="max-h-[62vh] overflow-y-auto overflow-x-auto overscroll-contain">
        <table class="w-full text-left text-sm">
          <thead class="sticky top-0 z-10">
            <tr class="text-[10px] uppercase tracking-[0.18em] text-white/40 [&>th]:bg-[#12131a] [&>th]:border-b [&>th]:border-white/10">
              <th class="px-4 py-3 font-medium sm:px-5">#</th>
              <th class="px-2 py-3 font-medium">Jugador</th>
              <th class="px-4 py-3 text-right font-medium sm:px-5">Puntos</th>
            </tr>
          </thead>
          <tbody id="tabla" class="divide-y divide-white/5"></tbody>
        </table>
      </div>
      <p id="estado" class="px-5 py-8 text-center text-sm text-white/50">Cargando…</p>
    </div>

    <div class="mt-8 flex flex-col gap-3 sm:flex-row">
      <!-- Sólo aparece si la lista no empieza por el primero, que es cuando de
           verdad hace falta: al llegar anclado a un puesto bajo. -->
      <button id="al-top" type="button" class="foco hidden items-center justify-center rounded-full border border-white/15 bg-white/5 px-6 py-3 text-sm font-semibold text-white transition hover:bg-white/10">
        Ver a los primeros
      </button>
      <a href="index.html" class="foco inline-flex items-center justify-center rounded-full bg-white px-6 py-3 text-sm font-semibold text-black">
        Jugar
      </a>
    </div>

    <p class="mt-auto pt-10 text-center text-xs text-white/25">
      Datos de The Numbers, FilmAffinity y Wikipedia ·
      <a href="privacidad.html" class="underline underline-offset-2 hover:text-white/60">Privacidad</a> ·
      <a href="aviso-legal.html" class="underline underline-offset-2 hover:text-white/60">Aviso legal</a>
    </p>
  </main>

  <script>
    // Clave pública: sólo puede leer la clasificación. Registrar exige pasar por
    // la función, que rehace la partida antes de aceptarla.
    const SUPABASE = 'https://vupsyrunkwsqegdvtcbg.supabase.co';
    const CLAVE = 'sb_publishable_vrmWVzv3RQOd51uIhXCJGQ_ka7aGRJs';
    // Cuántos se cargan de una vez, y cuántos por delante del jugador. Con 60
    // hay margen de sobra para subir y bajar desde donde uno cae.
    const VENTANA = 60;
    const ANTES = 20;

    const tabla = document.getElementById('tabla');
    const estado = document.getElementById('estado');
    const caja = document.getElementById('caja');
    const alTop = document.getElementById('al-top');

    // Quien acaba de registrar su marca se guarda el identificador: con él se
    // busca su puesto real y se le lleva hasta su fila.
    let mia = null;
    try { mia = localStorage.getItem('billions.miPuntuacion'); } catch (e) { /* modo privado */ }

    const cab = { apikey: CLAVE, Authorization: `Bearer ${CLAVE}` };
    const pide = (ruta, extra) => fetch(`${SUPABASE}/rest/v1/${ruta}`, { headers: { ...cab, ...extra } });

    const escapa = (s) => String(s).replace(/[&<>"']/g,
      (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    // Oro, plata y bronce: disco, cinta y borde de cada una.
    const MEDALLAS = {
      1: { disco: '#FFD60A', cinta: '#C99700', nombre: 'Oro' },
      2: { disco: '#D9DEE6', cinta: '#98A0AC', nombre: 'Plata' },
      3: { disco: '#E08A45', cinta: '#A4602A', nombre: 'Bronce' },
    };

    // La medalla va en SVG en línea, como los logos de compartir de fin.html:
    // el sitio no pide un solo archivo fuera, y así hereda el tamaño del texto.
    // Lleva dentro el número, que es el dato; la medalla sólo lo destaca.
    function medalla(puesto) {
      const m = MEDALLAS[puesto];
      if (!m) return `<span class="text-white/35">${puesto}</span>`;
      return `<svg viewBox="0 0 22 26" width="22" height="26" class="block" role="img" aria-label="${m.nombre}, puesto ${puesto}">
        <path d="M3 0h5.4l4.1 9-4.6 1.8z" fill="${m.cinta}"/>
        <path d="M19 0h-5.4l-4.1 9 4.6 1.8z" fill="${m.cinta}"/>
        <circle cx="11" cy="17" r="8.5" fill="${m.disco}" stroke="${m.cinta}" stroke-width="1.2"/>
        <circle cx="11" cy="17" r="6.2" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="0.9"/>
        <text x="11" y="17.6" text-anchor="middle" dominant-baseline="middle"
              font-size="9" font-weight="700" fill="#000" fill-opacity=".62"
              font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif">${puesto}</text>
      </svg>`;
    }

    function pinta(filas, desde) {
      tabla.innerHTML = filas.map((f, i) => {
        const puesto = desde + i + 1;
        const yo = f.id === mia;
        return `
        <tr class="${yo ? 'mia' : ''}">
          <td class="px-4 py-3 font-semibold tabular-nums sm:px-5">${medalla(puesto)}</td>
          <td class="px-2 py-3 font-medium text-white">${escapa(f.alias)}${
            yo ? ' <span class="ml-1.5 rounded-full bg-[#30D158]/20 px-2 py-0.5 text-[10px] font-semibold uppercase tracking-wide text-[#30D158]">Tú</span>' : ''
          }</td>
          <td class="px-4 py-3 text-right font-semibold tabular-nums text-white sm:px-5">${f.puntos}</td>
        </tr>`;
      }).join('');
    }

    // El puesto exacto: los que tienen más puntos, más los que empatan pero
    // llegaron antes. Sin la segunda mitad, dos empatados compartirían número.
    async function puestoDe(fila) {
      const filtro = `or=(puntos.gt.${fila.puntos},and(puntos.eq.${fila.puntos},creado_en.lt.${encodeURIComponent(fila.creado_en)}))`;
      const res = await pide(`puntuaciones?select=id&${filtro}`, { Prefer: 'count=exact', Range: '0-0' });
      const total = (res.headers.get('content-range') || '').split('/')[1];
      return Number(total || 0) + 1;
    }

    async function carga(desde) {
      const res = await pide(
        `puntuaciones?select=id,alias,puntos&order=puntos.desc,creado_en.asc` +
        `&offset=${desde}&limit=${VENTANA}`);
      if (!res.ok) throw new Error(res.status);
      return res.json();
    }

    (async () => {
      try {
        let desde = 0;

        // Si el jugador viene de registrar su marca, la lista empieza donde él
        // está y no por el número uno: es su puesto lo que ha venido a ver.
        if (mia) {
          const suya = await pide(`puntuaciones?select=id,puntos,creado_en&id=eq.${mia}`);
          const [fila] = suya.ok ? await suya.json() : [];
          // Si ya no existe —borrada— se cae al top sin decir nada.
          if (fila) desde = Math.max(0, (await puestoDe(fila)) - 1 - ANTES);
        }

        const filas = await carga(desde);
        if (!filas.length) {
          estado.textContent = 'Todavía no hay ninguna partida registrada. Sé el primero.';
          return;
        }
        pinta(filas, desde);
        estado.classList.add('hidden');

        // Anclar en su fila, dentro de la caja y sin animación: la lista tiene
        // que aparecer ya colocada, no desplazarse sola delante del jugador.
        const suya = tabla.querySelector('.mia');
        if (suya) {
          caja.scrollTop = suya.offsetTop - caja.clientHeight / 2 + suya.clientHeight / 2;
        }
        if (desde > 0) {
          alTop.classList.remove('hidden');
          alTop.classList.add('inline-flex');
          alTop.addEventListener('click', async () => {
            pinta(await carga(0), 0);
            caja.scrollTop = 0;
            alTop.classList.add('hidden');
          });
        }
      } catch (error) {
        estado.textContent = 'No se ha podido cargar la clasificación. Inténtalo más tarde.';
      }
    })();
  </script>
</body>
</html>
