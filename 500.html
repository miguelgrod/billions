<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billions · Error del servidor</title>
  <meta name="robots" content="noindex">
  <!-- Rutas absolutas a propósito: esta página se sirve para cualquier URL que
       no exista, incluida /lo/que/sea/, y con rutas relativas el navegador
       buscaría el CSS y el fondo colgando de esa carpeta inventada. -->
  <script src="/vendor/tailwind.js"></script>
  <style>
    :root { color-scheme: dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
      background: #07080c;
      color: rgba(255,255,255,0.9);
    }
    .display {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
      letter-spacing: -0.06em;
      font-weight: 700;
    }
    .esfera { border-radius: 50%; }

    /* La misma deriva del campo de burbujas: dos ejes con periodos distintos,
       cada uno de ida y vuelta con una curva casi sinusoidal, así que sólo se
       detiene en los extremos y la trayectoria compuesta no se repite a la
       vista. Un único fotograma con varios puntos frenaría en cada uno. */
    @keyframes derivaX { to { translate: var(--dx) 0; } }
    @keyframes derivaY { to { translate: 0 var(--dy); } }
    .deriva-x {
      will-change: translate;
      animation: derivaX var(--tx) cubic-bezier(.45,0,.55,1) infinite alternate;
      animation-delay: var(--rx);
    }
    .deriva-y {
      will-change: translate;
      animation: derivaY var(--ty) cubic-bezier(.45,0,.55,1) infinite alternate;
      animation-delay: var(--ry);
    }
    @media (max-width: 639px) {
      .deriva-x { animation-duration: calc(var(--tx) * .78); }
      .deriva-y { animation-duration: calc(var(--ty) * .78); }
    }

    @keyframes aparecer {
      from { opacity: 0; transform: translateY(10px) scale(.98); }
      to   { opacity: 1; transform: none; }
    }
    .aparece { animation: aparecer .5s cubic-bezier(.2,.8,.2,1) both; }
    .aparece:nth-child(2) { animation-delay: .08s; }
    .aparece:nth-child(3) { animation-delay: .18s; }

    .foco { transition: transform .2s cubic-bezier(.2,.8,.2,1); }
    .foco:hover { transform: scale(1.055); }
    .foco:active { transform: scale(1); }

    /* `safe center` y no `center` a secas: centrando sin más, si el contenido no
       cabe se desborda por arriba y no hay manera de llegar a él. */
    .centro-seguro { justify-content: safe center; }

    @media (prefers-reduced-motion: reduce) {
      .deriva-x, .deriva-y, .aparece { animation: none; }
      .foco { transition: none; }
    }
  </style>
</head>
<body class="relative min-h-screen antialiased">
  <!-- El mismo fondo del juego: bokeh nocturno al 18 % sobre negro y tres luces
       difusas de color encima. Fijo, y no con background-attachment, que en iOS
       da problemas. -->
  <div class="pointer-events-none fixed inset-0 -z-30" style="background:#000"></div>
  <div class="pointer-events-none fixed inset-0 -z-30"
       style="background-image:url('/imgs/bg_game.webp');background-size:cover;background-position:center;opacity:.18"></div>
  <div class="pointer-events-none fixed inset-0 -z-20"
       style="background:
         radial-gradient(65% 50% at 18% 12%, rgba(255,159,10,.12), transparent 60%),
         radial-gradient(55% 45% at 82% 22%, rgba(10,132,255,.12), transparent 60%),
         radial-gradient(65% 60% at 50% 92%, rgba(191,90,242,.10), transparent 60%)"></div>

  <!-- Las esferas del juego, flotando por detrás -->
  <div id="esferas" class="pointer-events-none fixed inset-0 -z-10 overflow-hidden"></div>
  <!-- Velo que oscurece el centro para que el texto se lea sobre las esferas -->
  <div class="pointer-events-none fixed inset-0 -z-10"
       style="background:radial-gradient(95% 62% at 50% 46%, rgba(8,8,11,.86) 0%, rgba(8,8,11,.55) 55%, rgba(8,8,11,.12) 100%)"></div>

  <main class="centro-seguro relative flex min-h-screen flex-col items-center gap-6 px-5 py-16 text-center sm:gap-9">
    <header class="aparece">
      <p class="display leading-[.88]" style="font-size:clamp(5rem,20vw,12rem)">500</p>
      <p class="display mt-4 leading-none text-white" style="font-size:clamp(1.5rem,4.5vw,2.75rem)">
        Algo ha fallado
      </p>
    </header>

    <p class="aparece w-full max-w-md text-white/60" style="font-size:clamp(1rem,2vw,1.2rem);line-height:1.5">
      El servidor no ha podido darte la página. No es cosa tuya:
      vuelve a intentarlo dentro de un momento.
    </p>

    <a href="/" class="aparece foco inline-flex items-center justify-center rounded-full bg-white px-8 py-4 text-[17px] font-semibold text-black shadow-2xl">
      Volver al juego
    </a>

  </main>

  <footer class="pointer-events-none absolute inset-x-0 bottom-0 px-4 pb-6 text-center">
    <p class="pointer-events-auto text-xs text-white/25">
      Datos de The Numbers, FilmAffinity y Wikipedia ·
      <a href="/privacidad.html" class="underline underline-offset-2 hover:text-white/60">Privacidad</a> ·
      <a href="/aviso-legal.html" class="underline underline-offset-2 hover:text-white/60">Aviso legal</a>
    </p>
  </footer>

  <script>
    // Las esferas son las mismas pompas del juego, pero de degradado puro: aquí
    // no se cargan movies.js ni las fotos, porque una página de error tiene que
    // pintarse sola y cuanto antes. La rampa es la de las nueve categorías —los
    // nueve tonos repartidos entre el turquesa y el rosa—, así que se reconoce
    // como parte del juego aunque no lleve carátulas.
    const ESFERA = [
      { luz: '#DBFFFE', medio: '#9AF4F1', hondo: '#64C4C1' },
      { luz: '#DBF4FF', medio: '#9AD8F4', hondo: '#64A6C4' },
      { luz: '#DBE7FF', medio: '#9AB9F4', hondo: '#6485C4' },
      { luz: '#DBDBFF', medio: '#9A9AF4', hondo: '#6464C4' },
      { luz: '#E7DBFF', medio: '#B99AF4', hondo: '#8564C4' },
      { luz: '#F4DBFF', medio: '#D89AF4', hondo: '#A664C4' },
      { luz: '#FFDBFE', medio: '#F49AF1', hondo: '#C464C1' },
      { luz: '#FFDBF1', medio: '#F49AD2', hondo: '#C464A0' },
      { luz: '#FFDBE5', medio: '#F49AB3', hondo: '#C4647F' },
    ];
    const rnd = (n) => Math.random() * n;

    function pinta() {
      const caja = document.getElementById('esferas');
      const ancho = caja.clientWidth || window.innerWidth;
      const alto = caja.clientHeight || window.innerHeight;
      // El diámetro se mide del contenedor, como en el campo: con píxeles fijos,
      // unas esferas de 70 px se pierden en una pantalla entera.
      const base = Math.min(ancho / 5, alto / 4) * 0.78;
      const n = ancho < 640 ? 9 : 14;
      caja.innerHTML = Array.from({ length: n }, (_, i) => {
        const { luz, medio, hondo } = ESFERA[i % ESFERA.length];
        const escala = 0.42 + rnd(0.75);
        const d = Math.max(46, base * escala);
        // las pequeñas van algo desenfocadas: da profundidad de campo
        const desenfoque = escala < 0.8 ? (0.8 - escala) * 6 : 0;
        return `<div style="position:absolute;left:${rnd(96).toFixed(1)}%;top:${rnd(92).toFixed(1)}%;
                            transform:translate(-50%,-50%)">
          <div class="deriva-x" style="--dx:${(rnd(70) - 35).toFixed(0)}px;--tx:${(26 + rnd(18)).toFixed(0)}s;--rx:-${rnd(20).toFixed(1)}s">
            <div class="deriva-y" style="--dy:${(rnd(70) - 35).toFixed(0)}px;--ty:${(31 + rnd(21)).toFixed(0)}s;--ry:-${rnd(20).toFixed(1)}s">
              <div class="esfera" style="width:${d.toFixed(0)}px;height:${d.toFixed(0)}px;
                   filter:blur(${desenfoque.toFixed(1)}px);
                   opacity:${(0.5 + rnd(0.3)).toFixed(2)};
                   background:radial-gradient(circle at 32% 26%, ${luz}, ${medio} 55%, ${hondo});
                   box-shadow:0 18px 50px ${medio}33"></div>
            </div>
          </div>
        </div>`;
      }).join('');
    }

    pinta();
    // El diámetro sale del contenedor, así que hay que repintar al cambiarlo.
    let t;
    window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(pinta, 200); });
  </script>
</body>
</html>
