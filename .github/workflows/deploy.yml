# Despliegue de Billions a su propio bucket.
#
# El proyecto vivía dentro del repo de Bonitu y se publicaba con él; desde
# agosto de 2026 tiene repositorio, bucket y distribución propios. Aquí todo
# cuelga de la raíz, así que el sync sale de `.` y hay que excluir a mano lo
# que no es del sitio.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  BUCKET: billions-cine
  REGION: eu-west-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.REGION }}

      # Todo menos index.html se guarda un año. Se puede porque cada <script src>
      # lleva la huella de su contenido (tools/sella-versiones.py): si un archivo
      # cambia, cambia su URL, y nunca hay que invalidar una copia guardada.
      #
      # Fuera del bucket: los Excel de origen, los scripts de tools/, la
      # documentación y lo que es del repositorio y no del sitio.
      - name: Sincronizar con S3
        run: |
          aws s3 sync . "s3://${BUCKET}" --delete \
            --exclude "*.html" \
            --exclude "*.md" \
            --exclude "*.xlsx" \
            --exclude ".git/*" \
            --exclude ".gitignore" \
            --exclude ".github/*" \
            --exclude "tools/*" \
            --exclude "mlb/tools/*" \
            --exclude "mlb/cache/*" \
            --exclude "mlb/src/*" \
            --exclude "mlb/supabase/*" \
            --exclude "supabase/*" \
            --exclude "build/*" \
            --exclude ".DS_Store" \
            --exclude "*/.DS_Store" \
            --cache-control "public, max-age=31536000, immutable"

      # Las páginas HTML van sin caché. index.html porque es la puerta de entrada
      # y la que trae las huellas nuevas —si se guardase, el navegador seguiría
      # pidiendo las versiones viejas de todo lo demás—, y las legales porque
      # tienen que poder corregirse el mismo día.
      - name: Subir las páginas HTML sin caché
        run: |
          aws s3 cp . "s3://${BUCKET}" --recursive \
            --exclude "*" --include "*.html" \
            --cache-control "no-cache, must-revalidate" \
            --content-type "text/html; charset=utf-8"

      # `https://ganoyo.com/mlb`, sin archivo, devolvía el XML de AccessDenied de
      # S3: con OAC, CloudFront no busca el documento índice dentro de una
      # carpeta y el bucket no da permiso de listado. Lo suyo sería una
      # CloudFront Function de viewer request, pero eso hay que configurarlo a
      # mano en la consola y `billions-deploy` no tiene permiso para tocar la
      # distribución.
      #
      # Así que se sube un objeto con esa clave exacta —y otro con la barra— que
      # no es una carpeta ni un índice: es una página que lleva al juego.
      #
      # Va DESPUÉS del sync a propósito: `--delete` borra lo que no está en el
      # repositorio, y estas dos claves no lo están. Se recrean en cada
      # despliegue. Excluirlas del sync habría sido más fino, pero el patrón
      # `mlb` es demasiado parecido al directorio `mlb/` como para arriesgarse:
      # si el CLI lo entendiera como la carpeta, `--delete` se llevaría el juego
      # entero del bucket.
      #
      # Y se usa `s3api put-object` y no `s3 cp` porque `cp` trata un destino
      # acabado en `/` como un prefijo y subiría `mlb/atajo.html` en vez de
      # crear la clave `mlb/`.
      - name: Atajo /mlb -> /mlb/index.html
        run: |
          cat > /tmp/atajo.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="0; url=/mlb/index.html">
            <link rel="canonical" href="https://ganoyo.com/mlb/index.html">
            <title>Perfect Nine</title>
          </head>
          <body style="background:#06120d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0">
            <p><a href="/mlb/index.html" style="color:#fff">Perfect Nine</a></p>
          </body>
          </html>
          HTML
          for clave in "mlb" "mlb/"; do
            aws s3api put-object \
              --bucket "${BUCKET}" --key "${clave}" \
              --body /tmp/atajo.html \
              --content-type "text/html; charset=utf-8" \
              --cache-control "no-cache, must-revalidate" >/dev/null
          done

      # Las páginas de error (403 y 404 -> /404.html, 500 -> /500.html) se
      # configuran a mano en la consola, no desde aquí: hacerlo requeriría darle
      # a `billions-deploy` permiso de UpdateDistribution, que deja reescribir la
      # distribución entera, y es algo que sólo hay que hacer una vez.
      # Los pasos están en INFRAESTRUCTURA.md.
      - name: Invalidar caché de CloudFront
        if: ${{ vars.BILLIONS_CF_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.BILLIONS_CF_ID }}" --paths "/*"

      - name: Resumen
        run: |
          echo "### Billions desplegado" >> $GITHUB_STEP_SUMMARY
          echo "- Bucket \`${BUCKET}\` (${REGION})" >> $GITHUB_STEP_SUMMARY
          echo "- https://ganoyo.com" >> $GITHUB_STEP_SUMMARY
